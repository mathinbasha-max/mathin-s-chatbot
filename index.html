<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My AI Chatbot</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <h1>🤖 My AI Chatbot</h1>

    <button id="enableNotifications" type="button">🔔 Enable Reminders</button>
    <p id="notificationStatus" role="status">Enable reminders to receive notifications even when this page is closed.</p>

    <div id="chat"></div>
    <div class="chat-input">
        <input type="text" id="message" placeholder="Ask me anything..." autocomplete="off">
        <button id="sendButton" type="button">Send</button>
    </div>

    <script src="/script.js"></script>
</body>
</html>
